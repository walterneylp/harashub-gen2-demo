<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HarasHub Gen2 — DEMO</title>
<style>
:root{--bg:#17231c;--panel:#203028;--panel2:#293a30;--ink:#edf2ed;--muted:#a6b2a8;--faint:#718075;--line:#41564a;--green:#79bd85;--green2:#184a31;--amber:#e6b86b;--red:#ef7d75;--blue:#78b7e6;--shadow:0 24px 58px #06110980}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.05px}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}.shell{min-height:100vh;display:grid;grid-template-columns:254px minmax(0,1fr)}.side{position:sticky;top:0;height:100vh;background:#19271f;border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:3px 10px 22px}.mark{height:35px;width:35px;border:1px solid #86bc8d88;border-radius:11px;display:grid;place-items:center;color:var(--green);font:700 21px Georgia;background:linear-gradient(135deg,#315841,#1d3228)}.brand strong{font-size:16px;letter-spacing:-.3px}.brand small,.eyebrow{display:block;color:var(--muted);font-size:10px;letter-spacing:1.2px;text-transform:uppercase}.nav-group{margin:10px 6px 4px;color:var(--faint);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.nav{width:100%;display:flex;align-items:center;gap:10px;border:1px solid transparent;border-radius:10px;padding:9px 10px;color:var(--muted);background:transparent;text-align:left;transition:.16s}.nav:hover,.nav.active{background:var(--panel2);border-color:var(--line);color:var(--ink)}.nav.active{box-shadow:inset 3px 0 var(--green)}.nav .ico{width:19px;text-align:center;color:var(--green);font-size:16px}.nav .count{margin-left:auto;font-size:10px;padding:1px 6px;border:1px solid var(--line);border-radius:9px;color:var(--muted)}.nav-bottom{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}.main{min-width:0}.topbar{height:67px;display:flex;align-items:center;gap:14px;padding:0 28px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:#17231cef;backdrop-filter:blur(15px)}.crumb{min-width:210px}.crumb b{display:block;font-size:14px}.search{max-width:440px;flex:1;position:relative}.search input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 35px 9px 13px;color:var(--ink)}.search span{position:absolute;right:12px;top:8px;color:var(--faint)}.top-actions{margin-left:auto;display:flex;align-items:center;gap:7px}.icon-btn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;min-height:36px;padding:7px 11px}.icon-btn{width:37px;padding:0}.btn:hover,.icon-btn:hover{border-color:#78b987;background:var(--panel2)}.btn.primary{background:var(--green);border-color:var(--green);color:#14241a;font-weight:800}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#496b52;color:#fff;font-size:11px;font-weight:800}.content{max-width:1600px;padding:29px 30px 60px;margin:auto}.page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.page-head h1{font-size:27px;line-height:1.1;letter-spacing:-.8px;margin:4px 0 0}.sub{color:var(--muted);margin:7px 0 0}.status{display:inline-flex;align-items:center;gap:6px;border:1px solid #4b7556;background:#23442e;color:#b8e2be;padding:5px 8px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.7px}.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:15px}.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px;box-shadow:0 8px 16px #00000010}.clickable{cursor:pointer;transition:transform .16s,border-color .16s,background .16s}.clickable:hover{transform:translateY(-2px);border-color:#6a9173;background:#26382e}.metric{font-size:25px;letter-spacing:-.8px;font-weight:750;margin:8px 0 2px}.delta{font-size:11px;color:var(--green)}.delta.warn{color:var(--amber)}.dashboard{grid-template-columns:1.45fr .9fr}.card-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.card-title h2{font-size:14px;margin:0;letter-spacing:-.1px}.link{color:var(--green);font-size:12px;border:0;background:transparent;padding:0}.timeline{display:grid;gap:0}.event{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}.event:first-child{border-top:0}.event:hover .event-name{color:var(--green)}.time{color:var(--muted);font-size:11px}.event-name{font-weight:700}.event-desc{font-size:11px;color:var(--muted);margin-top:2px}.badge{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:3px 6px;color:var(--muted)}.badge.red{border-color:#a85e58;color:#ffaaa1}.badge.amber{border-color:#9e7a3e;color:#f1c878}.spark{height:128px;position:relative;background:linear-gradient(180deg,#79bd8518,transparent);border-bottom:1px solid var(--line);overflow:hidden}.spark svg{position:absolute;inset:0;width:100%;height:100%}.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;padding-top:8px}.quick-grid{grid-template-columns:repeat(3,1fr);margin-top:15px}.quick{padding:14px;min-height:94px}.quick strong{display:block;margin:8px 0 2px}.quick p{color:var(--muted);font-size:11px;margin:0}.module-layout{grid-template-columns:1.1fr .9fr}.table-wrap{overflow:auto;padding:0}.table{width:100%;border-collapse:collapse;min-width:620px}.table th{text-align:left;color:var(--faint);font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line)}.table td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:12px}.table tbody tr{cursor:pointer;transition:.14s}.table tbody tr:hover{background:var(--panel2)}.table tr:last-child td{border:0}.name{font-weight:750}.muted{color:var(--muted)}.side-stack{display:grid;gap:15px}.progress{height:7px;background:#132018;border-radius:20px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:var(--green);border-radius:20px}.pill{font-size:10px;border-radius:20px;padding:3px 7px;background:#315039;color:#c8e7cb}.pill.amber{background:#5d4828;color:#f3d08d}.pill.blue{background:#294b5d;color:#abd8f3}.notice{border:1px dashed #58745f;background:#1c3025;padding:13px;border-radius:8px;color:var(--muted);font-size:12px}.notice b{color:var(--ink)}.module-actions{display:flex;gap:8px;flex-wrap:wrap}.offline{background:linear-gradient(110deg,#203028,#294531)}.offline h3{margin:3px 0;font-size:17px}.offline p{margin:7px 0 13px;color:#bed0c1;font-size:12px}.footer-note{color:var(--faint);font-size:10px;margin-top:22px;text-align:center}.overlay{position:fixed;inset:0;background:#07100aa8;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.overlay.open{display:flex}.modal{width:min(560px,100%);max-height:min(680px,90vh);overflow:auto;background:#203028;border:1px solid #57735e;border-radius:15px;box-shadow:var(--shadow);padding:22px;animation:rise .18s ease}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.modal h2{margin:4px 0;font-size:20px;letter-spacing:-.5px}.modal p{color:var(--muted)}.close{border:1px solid var(--line);color:var(--ink);background:transparent;width:32px;height:32px;border-radius:8px}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input,.field select{width:100%;background:#17231c;border:1px solid var(--line);color:var(--ink);padding:10px;border-radius:7px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.drawer{position:fixed;right:0;top:0;width:min(445px,100%);height:100vh;z-index:18;background:#203028;border-left:1px solid #57735e;transform:translateX(105%);transition:transform .22s;box-shadow:var(--shadow);padding:25px;overflow:auto}.drawer.open{transform:none}.drawer-backdrop{position:fixed;inset:0;background:#07100a78;z-index:17;display:none}.drawer-backdrop.open{display:block}.drawer h2{font-size:20px;margin:4px 0 14px}.drawer .item{padding:14px 0;border-top:1px solid var(--line)}.toast{position:fixed;right:22px;bottom:22px;z-index:30;background:#d9eedb;color:#183020;border:1px solid #89bf90;border-radius:9px;padding:11px 14px;box-shadow:var(--shadow);font-size:12px;font-weight:700;transform:translateY(90px);opacity:0;transition:.22s}.toast.show{transform:none;opacity:1}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}@media(max-width:1050px){.shell{grid-template-columns:72px 1fr}.side{padding:16px 9px}.brand{padding:3px 7px 18px}.brand div,.nav span:not(.ico):not(.count),.nav-group{display:none}.nav{justify-content:center;padding:10px}.nav .count{position:absolute;margin-left:30px;margin-top:-20px}.dashboard,.module-layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.shell{display:block}.side{position:fixed;z-index:10;bottom:0;top:auto;height:61px;width:100%;display:flex;flex-direction:row;padding:6px;background:#19271ff2;overflow-x:auto}.brand,.nav-group,.nav-bottom{display:none}.nav{width:48px;min-width:48px;padding:8px}.nav.active{box-shadow:inset 0 3px var(--green)}.topbar{height:59px;padding:0 14px}.crumb{min-width:0}.crumb small{display:none}.search{display:none}.top-actions .icon-btn:first-child{display:none}.content{padding:21px 15px 85px}.page-head{align-items:start;flex-direction:column;margin-bottom:16px}.page-head h1{font-size:23px}.kpis,.quick-grid{grid-template-columns:1fr 1fr}.metric{font-size:21px}.top-actions .btn{padding:7px 8px;font-size:11px}.status{font-size:9px}.quick{min-height:100px}.event{grid-template-columns:51px 1fr}.event .badge{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head>
<body>
<div class="shell"><aside class="side"><div class="brand"><div class="mark">H</div><div><strong>HarasHub</strong><small>Gen2 · DEMO</small></div></div><div id="nav"></div><div class="nav-bottom"><button class="nav" data-module="Governança & Integrações"><span class="ico">⌘</span><span>Governança</span></button></div></aside>
<main class="main"><header class="topbar"><div class="crumb"><small class="eyebrow">Operação demonstrativa</small><b id="crumb">Central de Comando</b></div><label class="search"><input id="search" aria-label="Pesquisar no demo" placeholder="Buscar animal, protocolo ou documento…"><span>⌕</span></label><div class="top-actions"><button class="icon-btn" data-action="notificacoes" aria-label="Notificações">◌</button><button class="icon-btn" data-action="ajuda" aria-label="Ajuda">?</button><button class="btn primary" data-action="novo">+ Novo registro</button><button class="avatar" data-action="perfil" aria-label="Perfil demo">MS</button></div></header><section class="content" id="app"></section></main></div>
<div class="drawer-backdrop" id="drawerBack"></div><aside class="drawer" id="drawer"></aside><div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><span class="eyebrow">Ambiente SYN/DEMO</span><h2 id="modalTitle">Detalhe</h2></div><button class="close" data-action="fechar" aria-label="Fechar">×</button></div><div id="modalBody"></div><div class="modal-foot"><button class="btn" data-action="fechar">Cancelar</button><button class="btn primary" data-action="confirmar">Confirmar no demo</button></div></section></div><div class="toast" id="toast"></div>
<script>
'use strict';
const modules=[['Central de Comando','◈'],['Animal 360','♞'],['Genética & Registro','⌬'],['Reprodução & Maternidade','◌'],['Clínica & Protocolos','✚'],['Manejo & Nutrição','◒'],['Estoque & Farmácia','▣'],['Agenda','◷'],['Pessoas & Parceiros','◎'],['Documentos & Conformidade','▤'],['Comercial & Contratos','◇'],['Performance & Vaquejada','⚑'],['Financeiro Causal','◫'],['BI & Relatórios','▥'],['IA Assistida','✦'],['Campo Offline','▱']];
const meta={
'Animal 360':['Base zootécnica','Animal, linhagem, saúde, manejo e linha do tempo em um dossiê único.','38 animais ativos','Identificação, genealogia e eventos recentes'],
'Genética & Registro':['Rastreabilidade genética','Registros, parentesco e evidências de origem organizados para consulta.','14 registros pendentes','Documentação de linhagem'],
'Reprodução & Maternidade':['Ciclos com contexto','Acompanhamento de coberturas, diagnósticos, gestação e maternidade.','5 marcos nesta semana','Protocolos reprodutivos'],
'Clínica & Protocolos':['Saúde operacional','Protocolos clínicos, ocorrências e planos de cuidado para o rebanho.','3 acompanhamentos','Vigilância e prontuários'],
'Manejo & Nutrição':['Rotina de campo','Lotes, dietas, tarefas e controles de trato orientados por prioridade.','7 tarefas para hoje','Plano nutricional DEMO'],
'Estoque & Farmácia':['Controle de insumos','Itens, validade e movimentações de farmácia e almoxarifado.','4 itens em atenção','Lote e rastreabilidade'],
'Agenda':['Agenda integrada','Compromissos de manejo, clínica e operação em uma visão diária.','6 eventos hoje','Calendário operacional'],
'Pessoas & Parceiros':['Rede operacional','Papéis, responsáveis e parceiros relacionados aos eventos do haras.','12 pessoas ativas','Permissões demonstrativas'],
'Documentos & Conformidade':['Arquivo verificável','Documentos, evidências e prazos reunidos em um espaço de consulta.','2 prazos próximos','Conformidade documental'],
'Comercial & Contratos':['Negócios com histórico','Propostas, contratos e etapas comerciais vinculadas aos animais.','3 oportunidades abertas','Pipeline comercial DEMO'],
'Performance & Vaquejada':['Performance em campo','Treinos, provas, indicadores e histórico de performance por animal.','2 provas programadas','Evolução esportiva'],
'Financeiro Causal':['Financeiro causal','Custos e receitas conectados a animais, manejos e decisões operacionais.','R$ 18,4 mil em análise','Visão causal demonstrativa'],
'BI & Relatórios':['Leituras para decisão','Indicadores e relatórios navegáveis para priorizar a operação.','9 painéis disponíveis','Dados exclusivamente SYN/DEMO'],
'IA Assistida':['IA com supervisão','Sugestões explicáveis para triagem e organização — sempre revisão humana.','4 sugestões novas','Nenhuma automação real'],
'Campo Offline':['Pronto para o campo','Superfície de coleta local demonstrativa, com fila de sincronização simulada.','12 registros na fila','Sem conexão real'],
'Governança & Integrações':['Governança demonstrativa','Regras, trilhas e conectores representados apenas como superfícies visuais.','0 integrações reais','Ambiente sem API ou credenciais']};
let current='Central de Comando', toastTimer;
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function nav(){let h='<div class="nav-group">Visão</div>';modules.forEach((m,i)=>{if(i===2||i===7||i===12)h+='<div class="nav-group">'+(i===2?'Operação':i===7?'Gestão':'Inteligência')+'</div>';h+=`<button class="nav ${current===m[0]?'active':''}" data-module="${m[0]}"><span class="ico">${m[1]}</span><span>${m[0]}</span>${[0,3,4,6,7,9].includes(i)?'<em class="count">'+([4,5,3,4,6,2][[0,3,4,6,7,9].indexOf(i)])+'</em>':''}</button>`});$('#nav').innerHTML=h}
function kpi(label,value,detail,cls=''){return `<article class="card clickable" data-detail="${label}"><span class="eyebrow">${label}</span><div class="metric">${value}</div><span class="delta ${cls}">${detail}</span></article>`}
function command(){return `<div class="page-head"><div><span class="eyebrow">Haras Santa Aurora · SYN/DEMO</span><h1>Central de Comando</h1><p class="sub">Prioridades operacionais com contexto, para decidir antes de reagir.</p></div><button class="btn" data-action="filtro">◉ Filtrar visão</button></div><div class="grid kpis">${kpi('Atenções de hoje','06','2 críticas · abrir fila','warn')}${kpi('Animais acompanhados','38','+3 com evento recente')}${kpi('Agenda confirmada','12','83% do planejado')}${kpi('Índice operacional','87','↑ 4 pts vs. período')}</div><div class="grid dashboard"><article class="card"><div class="card-title"><h2>Fila inteligente de hoje</h2><button class="link" data-action="fila">Ver jornada</button></div><div class="timeline">${event('08:00','Manejo','Conferir lote Piquete Norte','Prioridade alta','red')}${event('10:30','Clínica','Revisão de protocolo — Seridó','Acompanhamento','amber')}${event('14:00','Reprodução','Ultrassom previsto — Lua Serena','Confirmado','')}${event('16:30','Documentos','Validar registro de origem','Prazo hoje','amber')}</div></article><article class="card clickable" data-detail="Pulso da operação"><div class="card-title"><h2>Pulso da operação</h2><span class="pill">+12% consistência</span></div><div class="spark"><svg viewBox="0 0 400 120" preserveAspectRatio="none"><path d="M0 95 C25 80 38 88 58 70 S90 78 112 54 S145 65 166 43 S205 58 225 37 S260 47 280 29 S319 39 340 19 S375 26 400 8 V120 H0Z" fill="#79bd8520"/><path d="M0 95 C25 80 38 88 58 70 S90 78 112 54 S145 65 166 43 S205 58 225 37 S260 47 280 29 S319 39 340 19 S375 26 400 8" fill="none" stroke="#79bd85" stroke-width="3"/></svg></div><div class="legend"><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Hoje</span></div></article></div><div class="grid quick-grid">${quick('Animal 360','Abrir dossiê de Lua Serena','♞')}${quick('Campo offline','Registrar ocorrência local','▱')}${quick('IA assistida','Triar 4 sugestões novas','✦')}</div><p class="footer-note">Protótipo visual · Dados SYN/DEMO · Nenhuma conexão, API ou integração real.</p>`}
function event(time,title,desc,badge,kind){return `<div class="event" data-detail="${title}: ${desc}"><span class="time">${time}</span><div><div class="event-name">${title}</div><div class="event-desc">${desc}</div></div><span class="badge ${kind}">${badge}</span></div>`}function quick(title,desc,icon){return `<article class="card quick clickable" data-module="${title==='Animal 360'?'Animal 360':title==='Campo offline'?'Campo Offline':'IA Assistida'}"><span class="eyebrow">${icon} Atalho</span><strong>${title}</strong><p>${desc}</p></article>`}
function modulePage(name){let m=meta[name], rows=name==='Animal 360'?[['Lua Serena','Mangalarga · 7 anos','Acompanhamento','Hoje, 10:30'],['Seridó do Vale','Quarto de Milha · 5 anos','Protocolo ativo','Hoje, 14:00'],['Brasa Alta','Mangalarga · 9 anos','Sem alertas','Ontem']]:[['Registro SYN-014','Em revisão','Responsável DEMO','Hoje'],['Plano operacional 28','Em andamento','Equipe de campo','Amanhã'],['Evidência DOC-088','Pendente de validação','Gestão DEMO','18 set.'],['Evento OP-321','Concluído','Haras Santa Aurora','Ontem']];let bars=[['Cobertura operacional',82],['Evidências vinculadas',68],['Conformidade do período',91]];return `<div class="page-head"><div><span class="eyebrow">Módulo · SYN/DEMO</span><h1>${name}</h1><p class="sub">${m[1]}</p></div><div class="module-actions"><button class="btn" data-action="exportar">Exportar visual</button><button class="btn primary" data-action="novo">+ Adicionar</button></div></div><div class="grid kpis">${kpi('Visão atual',m[2],'Atualizado nesta tela')}${kpi('Status',name==='Campo Offline'?'Offline simulado':'Em acompanhamento','Clique para detalhar')}${kpi('Pendências','04','Revisar com prioridade','warn')}${kpi('Registro DEMO','SYN-028','Rastreável na interface')}</div><div class="grid module-layout"><article class="card table-wrap"><div class="card-title" style="padding:16px 16px 0"><h2>${m[3]}</h2><button class="link" data-action="ordenar">Ordenar ↕</button></div><table class="table"><thead><tr><th>Registro</th><th>Status</th><th>Referência</th><th>Atualização</th></tr></thead><tbody>${rows.map(r=>`<tr data-detail="${r[0]}"><td class="name">${r[0]}</td><td><span class="pill ${r[1].includes('Pendente')?'amber':''}">${r[1]}</span></td><td class="muted">${r[2]}</td><td class="muted">${r[3]}</td></tr>`).join('')}</tbody></table></article><div class="side-stack"><article class="card clickable" data-detail="Indicadores de ${name}"><div class="card-title"><h2>Indicadores do módulo</h2><span class="badge">DEMO</span></div>${bars.map(x=>`<div class="muted" style="font-size:11px">${x[0]} <b style="float:right;color:var(--ink)">${x[1]}%</b><div class="progress"><i style="width:${x[1]}%"></i></div></div>`).join('')}</article><article class="card notice clickable" data-detail="Nota operacional"><b>Contexto disponível.</b><br>Este espaço exibe dados sintéticos para validação de interface; nenhuma ação é persistida.</article>${name==='Campo Offline'?'<article class="card offline clickable" data-action="sync"><span class="eyebrow">Modo demonstrativo</span><h3>12 registros na fila local</h3><p>Simule a conferência antes do próximo ponto de conexão.</p><button class="btn">Ver fila simulada</button></article>':''}</div></div><div class="grid quick-grid">${quick('Central de Comando','Retornar às prioridades','◈')}${quick('IA assistida','Consultar sugestões','✦')}${quick('Campo offline','Abrir coleta local','▱')}</div><p class="footer-note">Dados SYN/DEMO. Sem URLs externas, APIs, credenciais ou integração real.</p>`}
function render(name=current){current=name; $('#crumb').textContent=name;nav();$('#app').innerHTML=name==='Central de Comando'?command():modulePage(name)}
function toast(msg){clearTimeout(toastTimer);let t=$('#toast');t.textContent=msg;t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body||`<p>Você abriu uma superfície demonstrativa de <b>${esc(title)}</b>. Os dados são SYN/DEMO e a confirmação não grava alterações.</p><div class="field"><label>Observação demonstrativa</label><input value="Revisar este item na próxima rotina"></div>`;$('#overlay').classList.add('open')}
function closeModal(){$('#overlay').classList.remove('open')}
function openDrawer(title){$('#drawer').innerHTML=`<div class="modal-head"><div><span class="eyebrow">Painel lateral · DEMO</span><h2>${esc(title)}</h2></div><button class="close" data-action="drawerclose">×</button></div><p class="muted">Contexto resumido para apoiar a navegação. Nenhum dado vem de sistema externo.</p><div class="item"><b>Origem</b><br><span class="muted">Base sintética Haras Santa Aurora</span></div><div class="item"><b>Responsável</b><br><span class="muted">Equipe operacional DEMO</span></div><div class="item"><b>Próxima ação</b><br><button class="link" data-action="novo">Criar acompanhamento demonstrativo</button></div>`;$('#drawer').classList.add('open');$('#drawerBack').classList.add('open')}
function closeDrawer(){$('#drawer').classList.remove('open');$('#drawerBack').classList.remove('open')}
document.addEventListener('click',e=>{let el=e.target.closest('[data-module],[data-detail],[data-action]');if(!el)return;if(el.dataset.module){render(el.dataset.module);return}if(el.dataset.detail){openDrawer(el.dataset.detail);return}let a=el.dataset.action;if(a==='fechar')closeModal();else if(a==='drawerclose')closeDrawer();else if(a==='confirmar'){closeModal();toast('Confirmação simulada — nada foi gravado.')}else if(a==='novo')openModal('Novo registro demonstrativo',`<p>Crie uma entrada visual para testar o fluxo. Nenhum dado será salvo.</p><div class="field"><label>Tipo de registro</label><select><option>Ocorrência operacional</option><option>Acompanhamento animal</option><option>Documento</option></select></div><div class="field"><label>Título</label><input placeholder="Ex.: Conferência de lote"></div>`);else if(a==='notificacoes')openDrawer('Notificações demonstrativas');else if(a==='perfil')openDrawer('Perfil de Marina Silva');else if(a==='ajuda')openModal('Ajuda do protótipo','<p>Navegue pelos módulos, abra linhas e cards, ou simule ações. Todo elemento acionável apresenta uma resposta visual.</p>');else if(a==='filtro')openModal('Filtrar visão','<div class="field"><label>Período</label><select><option>Hoje</option><option>Esta semana</option><option>Este mês</option></select></div><div class="field"><label>Foco</label><select><option>Toda a operação</option><option>Prioridades críticas</option><option>Reprodução</option></select></div>');else if(a==='fila')openDrawer('Jornada operacional de hoje');else if(a==='exportar')toast('Exportação visual simulada — arquivo não gerado.');else if(a==='ordenar')toast('Ordenação demonstrativa aplicada.');else if(a==='sync')openDrawer('Fila local simulada')});
$('#drawerBack').addEventListener('click',closeDrawer);$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal()});$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){openDrawer('Resultado de busca: '+(e.target.value||'consulta demonstrativa'));e.target.value=''}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}});render();
</script></body></html>
