<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HarasHub Gen2 · Jornadas Operacionais</title><style>:root{--bg:#0b0f0d;--p:#101512;--p2:#151b17;--i:#edf2ed;--m:#94a096;--l:#263129;--g:#79bd85;--a:#e6b86b;--r:#ef7d75;--v:#a99bff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:14px system-ui}.wrap{max-width:1280px;margin:auto;padding:26px}.ey{font:10px ui-monospace;color:var(--g);letter-spacing:1px}.head{display:flex;justify-content:space-between;gap:16px;align-items:end}.head h1{font:400 34px Georgia;margin:5px 0}.head p{color:var(--m);max-width:680px}.tabs{display:flex;gap:7px;margin:25px 0;border-bottom:1px solid var(--l)}button{cursor:pointer;border:1px solid var(--l);border-radius:8px;padding:9px 12px;background:var(--p);color:var(--i);font-weight:650}button:hover,.active{border-color:var(--g);background:var(--p2)}.primary{background:var(--g);color:#082315;border-color:var(--g)}.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.2fr .8fr}.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:16px}.card h2{font:500 20px Georgia;margin:6px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{font:10px ui-monospace;border:1px solid var(--l);padding:3px 6px;border-radius:5px;color:var(--m)}.green{color:var(--g)}.amber{color:var(--a)}.red{color:var(--r)}.list{margin:10px 0;padding:0;list-style:none}.list li{padding:12px 3px;border-top:1px solid var(--l);cursor:pointer}.list li:hover{background:var(--p2)}.list small{display:block;color:var(--m);margin-top:4px}.timeline{display:grid;gap:8px}.event{border-left:2px solid var(--g);padding:3px 0 12px 13px}.event small{color:var(--m);display:block;margin-top:3px}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--m);font:10px ui-monospace;padding:9px}td{border-top:1px solid var(--l);padding:11px 9px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{max-width:480px;width:100%;background:var(--p);border:1px solid var(--l);border-radius:14px;padding:20px}.toast{position:fixed;right:20px;bottom:20px;background:#dcf0df;color:#102c19;padding:12px;border-radius:8px;display:none;font-weight:700}.toast.on{display:block}@media(max-width:760px){.wrap{padding:16px}.head{display:block}.g3,.g2{grid-template-columns:1fr}.head h1{font-size:29px}}</style><body><main class="wrap"><div class="head"><div><span class="ey">HARASHUB GEN2 · JORNADAS DE DECISÃO</span><h1>Operação, documentos e comercial</h1><p>Três visões conectadas por entidade, evento, responsabilidade e evidência — não por telas isoladas.</p></div><button onclick="location.href='index.html'">← Voltar ao protótipo</button></div><nav class="tabs"><button class="active" data-v="agenda">Agenda operacional</button><button data-v="docs">Documentos e conformidade</button><button data-v="sales">Comercial e contratos</button></nav><section id="app"></section><p class="ey" style="margin-top:25px">SYN DEMO · sem banco, integração externa, assinatura ou envio real</p></main><div class="modal" id="modal"><div class="dialog"><button style="float:right" onclick="closeM()">×</button><span class="ey">CONTEXTO / EVIDÊNCIA</span><h2 id="mt"></h2><p id="mb" style="color:var(--m);line-height:1.55"></p><button class="primary" onclick="closeM()">Entendi</button></div></div><div class="toast" id="toast"></div><script>const $=x=>document.querySelector(x);function modal(t,b){$('#mt').textContent=t;$('#mb').textContent=b;$('#modal').classList.add('open')}function closeM(){$('#modal').classList.remove('open')}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),2600)}const pages={agenda:()=>`<div class="grid g3"><article class="card"><span class="ey">HOJE · 15 SET</span><h2>6 compromissos</h2><p class="amber">2 exigem decisão antes das 16h</p><button class="primary" onclick="modal('Novo compromisso SYN','O registro deve escolher entidade, responsável, janela, tipo e regra. Não cria evento clínico ou financeiro sozinho.')">+ Criar compromisso</button></article><article class="card"><span class="ey">EXCEÇÃO</span><h2>Janela pré-parto</h2><p>Eclipse IAS · documento sanitário vence antes da data estimada.</p><button onclick="modal('Exceção de agenda','A recomendação mostra fontes: agenda, reprodução e documento. A execução é humana e auditável.')">Ver evidências</button></article><article class="card"><span class="ey">EQUIPE</span><h2>4 rotas confirmadas</h2><p>Tratador, veterinária, reprodução e transporte com responsabilidade explícita.</p><button onclick="toast('Rotas SYN filtradas por papel e localização')">Ver rotas</button></article></div><div class="grid g2" style="margin-top:12px"><article class="card"><div class="row"><h2>Agenda por risco</h2><span class="badge red">P0 · 1</span></div><ul class="list"><li onclick="modal('US D30 · Safira IAS','Reprodução · 16:00 · responsável: Equipe de Reprodução · pré-condição: US D14 concluída.')"><b>16:00 · US D30 — Safira IAS</b><small>Reprodução · pré-condição atendida</small></li><li onclick="modal('Checklist pré-parto · Eclipse IAS','Maternidade · 18:00 · 1 documento em atenção. O checklist não confirma parto.')"><b>18:00 · Checklist pré-parto — Eclipse IAS</b><small>Maternidade · documento em atenção</small></li><li onclick="modal('Conciliação OFX-00931','Financeiro · responsável administrativo · movimento bancário não equivale à baixa.')"><b>Hoje · Revisar conciliação OFX-00931</b><small>Financeiro · revisão humana obrigatória</small></li></ul></article><article class="card"><h2>Linha do tempo</h2><div class="timeline"><div class="event"><b>Agenda criada</b><small>SYN-AG-108 · correlação SYN-COR-19</small></div><div class="event"><b>Documento relacionado</b><small>GTA-441 · validade verificada</small></div><div class="event"><b>Responsável notificado</b><small>demonstração: nenhum canal externo acionado</small></div></div></article></div>`,docs:()=>`<div class="grid g3"><article class="card"><span class="ey">VALIDADE</span><h2>4 documentos em atenção</h2><p class="red">1 pode bloquear agenda pré-parto</p><button class="primary" onclick="modal('Solicitar atualização SYN','Esta demonstração cria apenas uma intenção visual; não envia WhatsApp, e-mail ou assina documento.')">Solicitar atualização</button></article><article class="card"><span class="ey">EVIDÊNCIA</span><h2>Checksum e origem</h2><p>Documento, versão, autor, escopo, consentimento e vínculo aparecem antes de qualquer ação.</p><button onclick="modal('Trilha de evidência','SHA demonstrativo, fonte declarada e data de verificação; não é uma assinatura digital real.')">Ver trilha</button></article><article class="card"><span class="ey">POLÍTICA</span><h2>Retenção e acesso</h2><p>Permissão do documento não é a mesma permissão do animal ou contrato.</p><button onclick="toast('Política SYN v3 exibida no drawer em produção')">Ver política</button></article></div><article class="card" style="margin-top:12px"><h2>Fila de conformidade</h2><table><tr><th>DOCUMENTO</th><th>ENTIDADE</th><th>VALIDADE</th><th>IMPACTO</th></tr><tr onclick="modal('GTA-441','Vinculado à Eclipse IAS; vence em 16 dias. Impacta movimentação, não altera automaticamente o estado clínico.')"><td>GTA-441</td><td>Eclipse IAS</td><td class="amber">16 dias</td><td>Agenda / transporte</td></tr><tr onclick="modal('Exame sanitário SYN','Evidência declarada e revisão pendente; não possui integração oficial com associação ou laboratório.')"><td>Exame sanitário SYN</td><td>Vulcano IAS</td><td class="red">Revisar</td><td>Clínica</td></tr><tr onclick="modal('Contrato de cobertura SYN-38','Documento ligado a direito, parcela e partes; não gera PIX nem baixa.')"><td>Contrato SYN-38</td><td>Safira IAS</td><td class="green">Vigente</td><td>Comercial</td></tr></table></article>`,sales:()=>`<div class="grid g3"><article class="card"><span class="ey">FUNIL</span><h2>12 oportunidades ativas</h2><p>Origem, interesse, entidade e próximo passo; sem misturar proposta com contrato.</p><button class="primary" onclick="modal('Nova oportunidade SYN','A oportunidade nasce sem obrigação financeira. Só um contrato/direito confirmado pode criar um recebível.')">+ Nova oportunidade</button></article><article class="card"><span class="ey">PROPOSTA</span><h2>Cobertura SYN-38</h2><p>Safira IAS · proposta aceita, aguardando contrato e condições comerciais.</p><button onclick="modal('Proposta SYN-38','Versão, validade, partes, itens e condição. Aceite de proposta não é pagamento.')">Abrir proposta</button></article><article class="card"><span class="ey">CAUSALIDADE</span><h2>Recebível separado</h2><p>Contrato → direito → parcela → baixa → conciliação → livro-razão.</p><button onclick="modal('Cadeia financeira','Nenhuma ação comercial registra banco ou concilia movimento. Cada etapa exige estado e evidência próprios.')">Examinar cadeia</button></article></div><div class="grid g2" style="margin-top:12px"><article class="card"><h2>Pipeline comercial</h2><ul class="list"><li onclick="toast('Lead SYN aberto no drawer')"><b>Interessado · Cobertura Eternal Dash</b><small>Qualificação · próxima ação amanhã</small></li><li onclick="modal('Proposta SYN-38','Aceita visualmente; pendência: contrato e identificação de partes.')"><b>Safira IAS · Cobertura SYN-38</b><small>Proposta aceita · contrato pendente</small></li><li onclick="modal('Contrato SYN-C-091','Vigente; recebível SYN-AR-011 aberto. Banco ainda não foi movimentado.')"><b>Hospedagem · Contrato SYN-C-091</b><small>Vigente · recebível aberto</small></li></ul></article><article class="card"><h2>Regra demonstrada</h2><p style="color:var(--m);line-height:1.65">O fluxo comercial não pode “pagar” nem “receber”. Ele documenta intenção, negociação, proposta e contrato. O financeiro só nasce a partir do fato contratual confirmado e mantém trilha causal.</p><button class="primary" onclick="toast('Recebível SYN criado apenas como demonstração visual')">Simular contrato confirmado</button></article></div>`};function render(v='agenda'){$('#app').innerHTML=pages[v]();document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}document.addEventListener('click',e=>{let b=e.target.closest('[data-v]');if(b)render(b.dataset.v)});render()</script></body></html>
