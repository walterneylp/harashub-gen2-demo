violet','FONTE: AGENDA + REPRODUÇÃO + DOCUMENTOS')}</p><button class="btn" data-view="animal">Abrir Painel do Animal</button>`);return}}document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v){S.view=v.dataset.view;render();return}let c=e.target.closest('[data-cmd]');if(c){close();let x=c.dataset.cmd;if(V[x]){S.view=x;render()}else act(x,c);return}let a=e.target.closest('[data-act]');if(a)act(a.dataset.act,a)});document.querySelector('#overlay').onclick=close;document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette()}if(e.key==='Escape')close()});render();</script></body></html>
